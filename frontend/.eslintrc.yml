env:
  browser: true
  node: true
extends:
  - eslint:recommended
  - plugin:react/recommended
  - plugin:@typescript-eslint/recommended
overrides: []
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: latest
  sourceType: module
plugins:
  - react
  - "@typescript-eslint"
settings: 
  react: 
    version: detect
rules:
  react/react-in-jsx-scope: off
  no-unused-vars: off
  "@typescript-eslint/no-unused-vars":
   - error